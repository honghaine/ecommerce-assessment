spring:
  application:
    name: flashsale-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flashsale}
    username: ${DB_USER:flashsale}
    password: ${DB_PASSWORD:flashsale}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: 3000
      data-source-properties:
        # keep constraint-violation values (emails, phones) out of exception messages/logs
        logServerErrorDetail: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms            # fail fast: Redis is an accelerator, callers fall back / fail open
      connect-timeout: 500ms

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  # Actuator on its own port: reachable by Prometheus / health checks on the internal network,
  # never through the load balancer or the public tunnel (which only forward :8080).
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: flashsale-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        flashsale.purchase.duration: true
  otlp:
    metrics:
      export:
        enabled: false          # metrics are scraped by Prometheus; OTLP is used for traces only
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    export:
      otlp:
        enabled: ${TRACING_ENABLED:false}   # true when Tempo runs (docker compose --profile observability)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}

# SQL spans in traces: statement text only, never bind values (they can hold emails / phones)
jdbc:
  includes: [CONNECTION, QUERY]
  datasource-proxy:
    include-parameter-values: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true          # "Try it out" open by default
    persist-authorization: true       # keep the Bearer token across page reloads
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: list
  default-produces-media-type: application/json

app:
  # Market metadata — single source of timezone/currency. Flash-sale config itself lives in the DB.
  regions:
    VN: { timezone: Asia/Ho_Chi_Minh, currency: VND }
    TH: { timezone: Asia/Bangkok, currency: THB }
    SG: { timezone: Asia/Singapore, currency: SGD }

  auth:
    jwt:
      issuer: flashsale-service
      secret: ${JWT_SECRET}                 # >= 32 chars, shared by all instances
      access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    otp:
      length: 6
      ttl: 5m
      max-attempts: 5
      resend-cooldown: 60s
      secret: ${OTP_SECRET}                 # >= 32 chars, HMAC key for codes/identifiers in Redis
      plain-storage: ${OTP_PLAIN_STORAGE:false}   # DEV/TEST ONLY: unhashed code + identifier in Redis

  rate-limit:
    rules:
      register-ip:         { limit: 10, window: 1m }
      register-identifier: { limit: 3,  window: 10m }
      otp-resend-ip:       { limit: 10, window: 1m }
      otp-verify-ip:       { limit: 20, window: 1m }
      login-ip:            { limit: "${RATE_LIMIT_LOGIN_IP:30}", window: 1m }   # raise for load tests
      login-identifier:    { limit: 5,  window: 1m }
      refresh-ip:          { limit: 60, window: 1m }
      purchase-user:       { limit: "${RATE_LIMIT_PURCHASE_USER:5}", window: 10s }

  wallet:
    initial-balance: ${WALLET_INITIAL_BALANCE:1000000}

  notification:
    dispatch-enabled: ${NOTIFICATION_DISPATCH_ENABLED:true}
    dispatch-interval-ms: 1000
    batch-size: 50
    mock-log-content: ${NOTIFICATION_MOCK_LOG_CONTENT:false}

  flash-sale:
    current-cache-ttl: 2s
    reconcile-interval-ms: 15000
    reconcile-horizon: 10m
    auto-approve: ${FLASH_SALE_AUTO_APPROVE:true}   # seller nominations skip platform review
    generate-interval-ms: 600000                    # slot/item generation from DB config + seller rules

  seed:
    enabled: ${SEED_ENABLED:false}
    password: ${SEED_PASSWORD:Secret123}
    buyers: ${SEED_BUYERS:200}
    buyer-balance: ${SEED_BUYER_BALANCE:100000000}
    regions: [VN]

  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-attempts: 10

  integrations:
    warehouse:
      api-key: ${WAREHOUSE_API_KEY:}     # empty = warehouse sync API disabled
