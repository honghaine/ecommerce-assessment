name: flashsale

x-app: &app
  build: .
  image: flashsale-service:local
  environment:
    SPRING_PROFILES_ACTIVE: docker
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:-flashsale}
    DB_USER: ${DB_USER:-flashsale}
    DB_PASSWORD: ${DB_PASSWORD:-flashsale}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-30}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
    OTP_SECRET: ${OTP_SECRET:-dev-only-otp-secret-change-me-0123456789abcdef}
    NOTIFICATION_MOCK_LOG_CONTENT: ${NOTIFICATION_MOCK_LOG_CONTENT:-true}
    OTP_PLAIN_STORAGE: ${OTP_PLAIN_STORAGE:-true}        # dev: readable OTP in Redis
    SEED_ENABLED: ${SEED_ENABLED:-true}                  # demo accounts, products, today/tomorrow slots
    RATE_LIMIT_LOGIN_IP: ${RATE_LIMIT_LOGIN_IP:-30}      # set high (e.g. 100000) for k6 load tests
    WAREHOUSE_API_KEY: ${WAREHOUSE_API_KEY:-}            # empty = warehouse sync API disabled
    TRACING_ENABLED: ${TRACING_ENABLED:-false}           # true → export traces to Tempo (--profile observability)
    OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    WALLET_INITIAL_BALANCE: ${WALLET_INITIAL_BALANCE:-1000000}
    OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
    OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"
      - "127.0.0.1:8081:8081"   # actuator (health, prometheus) — localhost only

  # --- Multi-instance demo: docker compose --profile scale up -d ---
  app-2:
    <<: *app
    profiles: ["scale"]

  nginx:
    image: nginx:1.27-alpine
    profiles: ["scale"]
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      app-2:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-flashsale}
      POSTGRES_USER: ${DB_USER:-flashsale}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flashsale}
      TZ: UTC
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Load test: docker compose --profile loadtest run --rm k6 ---
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    volumes:
      - ./docker/k6:/scripts:ro
    environment:
      BASE_URL: http://app:8080
    command: ["run", "/scripts/flash-sale.js"]
    depends_on:
      app:
        condition: service_healthy

  # --- Dev tools (web UIs): docker compose --profile tools up -d ---
  # Bound to 127.0.0.1 only; dev credentials.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flashsale.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["tools"]
    ports:
      - "127.0.0.1:5540:5540"
    environment:
      RI_PRE_SETUP_DATABASES_PATH: /config/databases.json
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    volumes:
      - ./docker/redisinsight/databases.json:/config/databases.json:ro
      - redisinsightdata:/data
    depends_on:
      redis:
        condition: service_healthy

  # --- Public URL via Cloudflare Quick Tunnel: docker compose --profile tunnel up -d tunnel ---
  # Prints a random https://*.trycloudflare.com URL in its logs. No account needed; URL changes on restart.
  # Only the API (app:8080) is exposed — never the DB, Redis or dev tools.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8080"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # --- Observability: docker compose --profile observability up -d  (Grafana → http://localhost:3000) ---
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver        # Tempo span metrics + optional k6 results
      - --enable-feature=exemplar-storage         # latency points → trace ids
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/1-fs-overview.json
      DB_USER: ${DB_USER:-flashsale}
      DB_NAME: ${DB_NAME:-flashsale}
      DB_PASSWORD: ${DB_PASSWORD:-flashsale}
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]

  loki:
    image: grafana/loki:3.5.3
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki

  alloy:
    image: grafana/alloy:v1.10.1
    profiles: ["observability"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["observability"]
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ["observability"]
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-flashsale}:${DB_PASSWORD:-flashsale}@postgres:5432/${DB_NAME:-flashsale}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    profiles: ["observability"]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # --- Future: Kafka (profile "kafka") can be added here without touching core services ---

volumes:
  pgdata:
  redisdata:
  pgadmindata:
  redisinsightdata:
  prometheusdata:
  grafanadata:
  lokidata:
  tempodata:
